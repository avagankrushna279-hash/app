# Render Blueprint: creates the web app AND its database, and connects them.
# Render asks you for the values marked "sync: false" when you deploy.
#
# Free plans are for TESTING ONLY: the free web service goes to sleep when idle (WhatsApp replies
# become slow or lost) and the free database expires after 30 days. Change both plans in the
# Render dashboard before real customers use it.

services:
  - type: web
    name: ai-receptionist
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-receptionist-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Start in test mode. To go live, change these in the dashboard (see START-HERE.txt).
      - key: MOCK_LLM
        value: "1"
      - key: WHATSAPP_MODE
        value: mock
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true

databases:
  - name: ai-receptionist-db
    plan: free
